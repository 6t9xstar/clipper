name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run clipper doctor
        env:
          CLIPPER_DATA_DIR: ${{ runner.temp }}/clipper-data
      - run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependency vulnerability scan
        run: |
          uv export --locked --no-hashes --no-dev --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --progress-spinner off

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: uv sync --locked
        working-directory: .
      # uses the Google Chrome preinstalled on GitHub's Ubuntu images (no Playwright browser download)
      - run: npm run e2e
        env:
          CLIPPER_E2E_CHANNEL: chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
